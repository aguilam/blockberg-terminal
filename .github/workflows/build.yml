name: build
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build windows x64
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o server-windows-amd64.exe .
      - name: Build linux x64
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o server-linux-amd64 .
      - name: Build macOS arm64
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o server-darwin-arm64 .